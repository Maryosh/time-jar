<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time Jar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f58fae">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=VT323&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff7f0;--glow:#ffe3ec;--card:#fff;--ink:#4a3b47;--muted:#7d6a78;--line:#f1e1da;--accent:#f58fae;--accent-ink:#4a2b3a;--glass:rgba(255,255,255,.7);--glass-line:#e3c9d6;--danger:#c0475f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2230;--glow:#3d2a4a;--card:#362c3f;--ink:#f6e9f1;--muted:#c4acbb;--line:#4a3d55;--accent:#f4a6c0;--accent-ink:#3a2030;--glass:rgba(255,255,255,.08);--glass-line:#7d6a8a;--danger:#f08a9c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2230;--glow:#3d2a4a;--card:#362c3f;--ink:#f6e9f1;--muted:#c4acbb;--line:#4a3d55;--accent:#f4a6c0;--accent-ink:#3a2030;--glass:rgba(255,255,255,.08);--glass-line:#7d6a8a;--danger:#f08a9c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 50% -5%,var(--glow) 0,transparent 60%),var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
main{max-width:480px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;gap:8px;align-items:center;margin-bottom:8px}
select,input,button,textarea{font:inherit;color:inherit}
select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700}
button{min-height:44px;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;transition:transform .12s,background .2s}
button:active{transform:scale(.95)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.danger{color:var(--danger)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{display:flex;flex-direction:column;align-items:center}
.jar-wrap{width:min(280px,78vw);transform-origin:50% 100%}
.jar-wrap.hit{animation:wob .55s ease-out}
.jar-wrap.glow{filter:drop-shadow(0 0 14px var(--accent));transition:filter 1s}
svg{display:block;width:100%;height:auto;overflow:visible}
.big{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-size:44px;line-height:1.05;margin:6px 0 0;text-align:center}
.sub{color:var(--muted);text-align:center;margin:2px 0 0;font-size:14px}
.bar{width:100%;height:6px;background:var(--line);border-radius:3px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 20px rgba(120,80,100,.08);padding:14px;margin-top:14px;animation:up .5s ease both}
.row{display:flex;gap:8px;align-items:center}
.ctl{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--bg);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:20px;font-weight:700}
.stats span{font-size:13px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .d{flex:1;min-width:0}
li .d small{display:block;color:var(--muted)}
li button{padding:4px 12px;min-height:40px}
li svg.ico{width:26px;height:26px;flex:none}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);padding:6px 0}
textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.msg{min-height:20px;font-size:14px;color:var(--muted);margin-top:6px;text-align:center}
.lbl{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{padding:8px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
.chips button svg{width:18px;height:18px}
.chips button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);font-weight:700}
.sw button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.shp button{padding:6px;border-radius:10px}
.shp button svg{width:24px;height:24px}
.shp button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#sheet:not([hidden]),#actForm:not([hidden]){animation:up .3s ease both}
.bump{animation:bump .5s ease}
#pops,#ms{pointer-events:none}
.hot{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px var(--accent)) brightness(1.2)}
.gl2{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.barw{position:relative;width:100%;margin:14px 0 24px}
.barw .bar{margin:0}
#notches i{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:2px solid var(--muted);transition:background .4s,transform .4s}
#notches i.reached{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
#notches span{position:absolute;top:13px;transform:translateX(-50%);font-size:11px;color:var(--muted)}
#bar.kb{display:none}
html,body{overflow-x:hidden}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:22;background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:24px;display:flex;align-items:center;gap:10px}
#toast button{min-height:36px;border-radius:18px}
.stats div{position:relative}
.stats .edt{touch-action:none;cursor:grab;animation:wig .6s ease-in-out infinite;user-select:none;-webkit-user-select:none}
.stats .edt u{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;text-decoration:none;font-size:12px;display:grid;place-items:center;cursor:pointer}
.stats .drag{animation:none;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:.92}
.stats .tgt{outline:3px dashed var(--accent);outline-offset:2px}
@keyframes wig{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
:root[data-style=sketch][data-style]{--bg:#fbf8f0;--card:#fffdf7;--ink:#26231f;--muted:#645f55;--line:#26231f;--accent:#ffd34e;--accent-ink:#26231f;--glass:rgba(255,255,255,.35);--glass-line:#26231f;--danger:#b3261e;--glow:transparent;color-scheme:light}
[data-style=sketch] body{font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:19px;background:repeating-linear-gradient(transparent 0 29px,#cfe0ee 29px 30px),#fbf8f0}
[data-style=sketch] .big{font-family:"Patrick Hand",cursive;font-size:54px}
[data-style=sketch] .card,[data-style=sketch] button,[data-style=sketch] .ctl,[data-style=sketch] select{border:2px solid #26231f;border-radius:18px 6px 20px 8px/8px 20px 6px 18px;box-shadow:none}
[data-style=sketch] #bar button{border-radius:18px 6px 20px 8px/8px 20px 6px 18px;box-shadow:none}
[data-style=sketch] .sp *{stroke:#26231f;stroke-width:1.4}
[data-style=sketch] .gl path{stroke-width:3.5}
[data-style=sketch] .bar{background:transparent;border:2px solid #26231f;height:12px}
[data-style=sketch] .bar i{border-radius:0}
:root[data-style=pixel][data-style]{--bg:#1a1033;--card:#2b1b55;--ink:#f4f1ff;--muted:#b9a9ee;--line:#6c4fd6;--accent:#35f0c8;--accent-ink:#10082b;--glass:rgba(255,255,255,.07);--glass-line:#8d78ff;--danger:#ff6b8a;--glow:transparent;color-scheme:dark}
[data-style=pixel] body{font-family:"VT323",monospace;font-size:22px;background:linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/16px 16px,#1a1033}
[data-style=pixel] .big,[data-style=pixel] h2,[data-style=pixel] #bar button{font-family:"Press Start 2P",monospace}
[data-style=pixel] .big{font-size:26px;line-height:1.3}
[data-style=pixel] h2,[data-style=pixel] #bar button{font-size:12px}
[data-style=pixel] .card,[data-style=pixel] button,[data-style=pixel] .ctl,[data-style=pixel] select{border:4px solid #6c4fd6;border-radius:0;box-shadow:4px 4px 0 #000}
[data-style=pixel] #bar button{border-radius:0;box-shadow:4px 4px 0 #000}
[data-style=pixel] svg *{shape-rendering:crispEdges}
[data-style=pixel] .sp *{stroke:#000;stroke-width:1.6}
[data-style=pixel] .gl path{stroke-width:5}
[data-style=pixel] .bar,[data-style=pixel] .bar i{border-radius:0}
:root[data-style=bold][data-style]{--bg:#ffe94d;--card:#fff;--ink:#000;--muted:#333;--line:#000;--accent:#ff5fa2;--accent-ink:#000;--glass:rgba(255,255,255,.5);--glass-line:#000;--danger:#d00000;--glow:transparent;color-scheme:light}
[data-style=bold] body{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:500}
[data-style=bold] .big{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:64px;letter-spacing:-2px}
[data-style=bold] .card,[data-style=bold] button,[data-style=bold] .ctl,[data-style=bold] select{border:3px solid #000;border-radius:6px;box-shadow:5px 5px 0 #000}
[data-style=bold] #bar button{border-radius:6px;box-shadow:5px 5px 0 #000}
[data-style=bold] .sp *{stroke:#000;stroke-width:1.6}
[data-style=bold] .gl path{stroke-width:5}
[data-style=bold] h2{text-transform:uppercase;letter-spacing:1px}
@keyframes jshake{0%,100%{transform:translate(0) rotate(0)}15%{transform:translate(-7px,0) rotate(-3.2deg)}30%{transform:translate(7px,-2px) rotate(3.2deg)}45%{transform:translate(-6px,0) rotate(-2.6deg)}60%{transform:translate(5px,-1px) rotate(2deg)}80%{transform:translate(-2px,0) rotate(-.8deg)}}
.jar-wrap.jshake{animation:jshake .6s ease-in-out}
@keyframes slr{from{opacity:0;transform:translateX(50px)}}@keyframes sll{from{opacity:0;transform:translateX(-50px)}}
.jar-wrap.slr{animation:slr .35s ease-out}.jar-wrap.sll{animation:sll .35s ease-out}
.tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.1)}}
.bub{animation:bub 4s linear infinite}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-170px);opacity:0}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{50%{transform:rotate(5deg)}}
.steam{animation:steam 3s ease-in-out infinite;transform-box:fill-box}.s2{animation-delay:1.4s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}40%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.pt{animation:burst 1s cubic-bezier(.2,.8,.3,1) forwards}
g.b{cursor:grab;-webkit-tap-highlight-color:transparent}
#jarWrap svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bar{position:fixed;left:16px;right:16px;max-width:448px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px}
#bar button{min-height:56px;border-radius:28px;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#ballBtn{flex:1}
#timerBtn{padding:0 22px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none;animation:fade .25s both}
body:has(#sheet:not([hidden])) #scrim,body:has(#editCard:not([hidden])) #scrim,body:has(#goalDlg:not([hidden])) #scrim{display:block}
#sheet,#editCard,#goalDlg{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:30;background:var(--card);border:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
#sheet:not([hidden]),#editCard:not([hidden]),#goalDlg:not([hidden]){animation:sheetUp .38s cubic-bezier(.2,.9,.25,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
g.b:hover{filter:brightness(1.12)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(.4deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-2.4deg) scaleY(.985)}45%{transform:rotate(1.8deg)}70%{transform:rotate(-.8deg)}}
@keyframes bump{40%{transform:scale(1.12)}}
@keyframes drop{
 0%{transform:translateY(-300px) rotate(-140deg);opacity:0;animation-timing-function:cubic-bezier(.5,0,1,.6)}
 10%{opacity:1}
 66%{transform:translateY(0) rotate(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
 80%{transform:translateY(-18px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
 90%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
 95%{transform:translateY(-4px)}100%{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.8);opacity:.9}to{transform:scale(2.6);opacity:0}}
g.new{animation:drop 1s both;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
g.new.fast{animation-duration:.7s}
circle.pop{animation:pop .6s ease-out both;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <button id="prevJar" aria-label="Previous jar">‹</button><div id="jarNav" style="flex:1;text-align:center;min-width:0"><div id="jarName" style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div><div id="dots" style="display:flex;gap:6px;justify-content:center;margin-top:4px"></div></div><button id="nextJar" aria-label="Next jar">›</button>
    <button id="themeBtn" aria-label="Toggle light or dark">◐</button>
  </header>

  <section class="hero">
    <div class="jar-wrap" id="jarWrap">
      <svg viewBox="0 0 240 280" aria-label="Jar filling with balls">
        <defs><clipPath id="clip"><path d="M30 62 Q16 72 16 104 L16 238 Q16 258 36 258 L204 258 Q224 258 224 238 L224 104 Q224 72 210 62 Z"/></clipPath></defs>
        <g class="gl"><path d="M30 62 Q16 72 16 104 L16 238 Q16 258 36 258 L204 258 Q224 258 224 238 L224 104 Q224 72 210 62 Z" fill="var(--glass)"/></g>
        <line id="ground" stroke="var(--glass-line)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".7"/><g id="thBack" class="tl"></g><g id="balls"></g>
        <g class="gl" style="pointer-events:none;opacity:.6"><circle cx="96" cy="122" r="4" fill="var(--ink)"/><circle cx="144" cy="122" r="4" fill="var(--ink)"/><path d="M108 134 Q120 145 132 134" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><ellipse cx="82" cy="133" rx="8" ry="5" fill="#ff9aa2" fill-opacity=".6"/><ellipse cx="158" cy="133" rx="8" ry="5" fill="#ff9aa2" fill-opacity=".6"/></g><g id="pops"></g>
        <g id="ms"></g><g id="thFront" class="tl"></g>
        <g class="gl"><path d="M30 62 Q16 72 16 104 L16 238 Q16 258 36 258 L204 258 Q224 258 224 238 L224 104 Q224 72 210 62" fill="none" stroke="var(--glass-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 58 L30 62 M218 58 L210 62" fill="none" stroke="var(--glass-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M44 120 Q38 150 40 200" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round" fill="none"/></g>
      </svg>
    </div>
    <p class="big" id="total">0m</p>
    <p class="sub" id="goalTxt"></p>
    <div id="goalEd" class="row" hidden style="margin-top:6px;width:100%"><input class="ctl" id="goalQ" type="number" step="0.5" min="0" inputmode="decimal" placeholder="Goal in hours (0 for none)"><button class="primary" id="goalQs">Set</button></div>
    <div class="barw"><div class="bar"><i id="barFill"></i></div><div id="notches"></div></div>
    <div class="row" style="margin-top:6px;justify-content:center"><button id="shakeBtn">Shake jar</button><button id="resetBtn">Reset</button></div>
  </section>

  <div class="msg" id="msg"></div>
  <div id="bar"><button class="primary" id="ballBtn">Add a ball</button><button id="timerBtn">▶ Start</button></div>
  <div id="scrim"></div>
  <div id="toast" hidden><span id="toastTxt"></span><button id="toastBtn">Undo</button></div>
  <div id="goalDlg" hidden>
    <h2>Goal reached!</h2>
    <p class="sub" style="text-align:left" id="gdSub">What next?</p>
    <div class="row" id="gdSetRow" hidden><input class="ctl" id="gdIn" type="number" step="0.5" min="0" inputmode="decimal" placeholder="New goal in hours"><button class="primary" id="gdSet">Set</button></div>
    <div style="display:grid;gap:8px;margin-top:12px"><button id="gdNew">Set another goal</button><button id="gdKeep">Keep adding</button><button class="primary" id="gdShelf">Shelf this jar and start a new one</button></div>
  </div>
  <div id="sheet" hidden>
      <label class="lbl">Which activity?</label>
      <div class="chips" id="actChips"></div>
      <label class="lbl" for="hrIn">How long was this session?</label>
      <div class="chips" id="chips">
        <button data-m="15">15m</button><button data-m="30">30m</button><button data-m="45">45m</button><button data-m="60">1h</button><button data-m="90">1h 30m</button><button data-m="120">2h</button>
      </div>
      <div class="row"><input class="ctl" id="hrIn" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Hours"><span>h</span><input class="ctl" id="minIn" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Minutes"><span>min</span></div>
      <label class="lbl" for="dateIn">Day it happened</label>
      <input class="ctl" id="dateIn" type="date">
      <label class="lbl" for="endIn">Ended at (optional, for time-of-day stats)</label>
      <input class="ctl" id="endIn" type="time">
      <div class="row" style="margin-top:12px"><button class="primary" id="addBtn">Drop the ball</button><button id="cancelBtn">Cancel</button><button class="danger" id="discardBtn" hidden>Discard timer</button></div>
  </div>

  <section class="card" id="editCard" hidden>
    <h2 id="editTitle">Edit ball</h2>
    <label class="lbl" for="eAct">Activity (pick one from another jar to move it there)</label>
    <select class="ctl" id="eAct"></select>
    <label class="lbl" for="eHr">How long</label>
    <div class="row"><input class="ctl" id="eHr" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Hours"><span>h</span><input class="ctl" id="eMin" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Minutes"><span>min</span></div>
    <label class="lbl" for="eDate">Day</label>
    <input class="ctl" id="eDate" type="date">
    <label class="lbl">Position in the jar</label>
    <div class="row"><button id="eEarlier">← Earlier</button><button id="eLater">Later →</button></div>
    <div class="row" style="margin-top:12px"><button class="primary" id="eSave">Save</button><button id="eCancel">Cancel</button><button class="danger" id="eDel">Delete</button></div>
  </section>

  <section class="card">
    <h2>Activities</h2>
    <ul id="actList"></ul>
    <button id="newActBtn" style="margin-top:8px">Add activity</button>
    <div id="actForm" hidden>
      <label class="lbl" for="actName">Name</label>
      <input class="ctl" id="actName" maxlength="30" placeholder="e.g. Reading">
      <label class="lbl">Colour</label>
      <div class="chips sw" id="swatches"></div>
      <label class="lbl">Style</label>
      <div class="chips shp" id="shapes"></div>
      <div class="row" style="margin-top:8px"><button class="primary" id="actSave">Save activity</button><button id="actCancel">Cancel</button><button class="danger" id="actDel" hidden>Delete</button></div>
    </div>
  </section>

  <section class="card">
    <h2>Stats</h2>
    <div class="stats" id="stats"></div><div id="tod"></div>
    <button id="statPickBtn" style="margin-top:10px">Edit stats</button><div id="statPick" hidden></div>
  </section>

/* Sync: private per-account copy via the page's db capability */
function syncStatus(t){$('syncSt').textContent=t}
function pushNow(){
  if(!dbRef)return;
  dbRef.set({json:JSON.stringify(S),updated:S.updated||Date.now()}).then(function(){syncStatus('Sync is on. Open this link signed in to the same Claude account on any device. Last saved '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+'.')}).catch(function(){syncStatus('Sync hit a problem. Your data is still saved on this device.')});
}
async function initSync(){
  try{
    var c=window.claude;if(!c||!c.use){syncStatus('Sync is off here. Your data is saved on this device only, so use Save backup file now and then.');return}
    var db=await c.use('db'),user=await c.use('user');
    if(!db||!user){syncStatus('Sync is off. Sign in to Claude and open the link there to turn it on. Data is saved on this device.');return}
    var id=await user.id();
    if(!id){syncStatus('Sync is off for this view. Data is saved on this device.');return}
    dbRef=db.doc('data/users/'+id+'/app');
    dbRef.onSnapshot(function(snap){
      if(!snap.exists){pushNow();return}
      var d=snap.data()||{},ru=d.updated||0,lu=S.updated||0;
      if(ru>lu){
        try{var r=migrate(JSON.parse(d.json));r.theme=S.theme;r.updated=ru;S=r;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}selAct=null;resetEdit();render();syncStatus('Sync is on. Updated from another device.')}catch(e){}
      }else if(ru<lu){pushNow()}
      else syncStatus('Sync is on. Everything is up to date.');
    },function(){syncStatus('Sync is off. Data is saved on this device.')});
  }catch(e){syncStatus('Sync is off. Data is saved on this device.')}
}
